<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mountain</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scene">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="White mountains with a bird flying overhead">
        <defs>
          <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#e8f4fc"/>
            <stop offset="55%" stop-color="#f5f9fc"/>
            <stop offset="100%" stop-color="#ffffff"/>
          </linearGradient>
          <linearGradient id="peakLight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#f0f4f8"/>
          </linearGradient>
          <linearGradient id="peakShadow" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#e2e8ef"/>
            <stop offset="100%" stop-color="#f8fafc"/>
          </linearGradient>
          <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <rect width="800" height="500" fill="url(#sky)"/>

        <ellipse cx="400" cy="380" rx="420" ry="80" fill="#ffffff" opacity="0.6"/>

        <path
          d="M0 320 L120 200 L220 260 L340 140 L480 240 L600 180 L720 260 L800 220 L800 500 L0 500 Z"
          fill="#f4f7fa"
          opacity="0.85"
        />

        <path
          d="M0 360 L200 240 L320 300 L420 160 L560 280 L680 200 L800 300 L800 500 L0 500 Z"
          fill="url(#peakShadow)"
          opacity="0.95"
        />

        <path
          d="M0 400 L180 220 L280 310 L400 120 L520 290 L640 210 L800 340 L800 500 L0 500 Z"
          fill="url(#peakLight)"
        />

        <path d="M400 120 L430 175 L370 175 Z" fill="#ffffff"/>
        <path d="M180 220 L205 265 L155 265 Z" fill="#ffffff" opacity="0.9"/>
        <path d="M640 210 L662 250 L618 250 Z" fill="#ffffff" opacity="0.85"/>

        <path
          d="M400 120 L520 290"
          fill="none"
          stroke="#e8edf2"
          stroke-width="1.5"
          stroke-linecap="round"
          opacity="0.5"
        />
        <path
          d="M400 120 L280 310"
          fill="none"
          stroke="#eef2f6"
          stroke-width="1"
          stroke-linecap="round"
          opacity="0.4"
        />

        <rect x="0" y="420" width="800" height="80" fill="url(#sky)" opacity="0.7"/>
    </svg>
    <canvas id="birds" aria-hidden="true"></canvas>
  </div>
  <script src="bird.js" defer></script>
</body>
</html>
